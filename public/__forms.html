<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aestrox enquiry form</title><meta name="robots" content="noindex"></head><body>
<!-- Netlify detects this static blueprint at deploy time. Fields match ContactForm. -->
<form name="aestrox-enquiry" method="POST" action="/thanks" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="form-name" value="aestrox-enquiry"><input name="bot-field"><input name="name"><input name="email" type="email"><input name="business"><input name="phone" type="tel"><input name="enquiry"><input name="billing-period"><textarea name="message"></textarea><input name="privacy-consent" type="checkbox">
</form>
</body></html>
